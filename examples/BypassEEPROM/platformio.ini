; PlatformIO Project Configuration File for UIRB 1.1V EEPROM Bypass Example
;
; **Overview:**
; This configuration file sets up build and environment settings for the Universal Infrared Blaster (UIRB)
; project, with a focus on EEPROM bypass functionality. It supports a custom UIRB V0.2 board along with
; other Arduino-compatible boards and includes debugging options like in-RAM EEPROM emulation.
;
; **Key Features:**
; - Targets Atmel AVR microcontrollers using the Arduino framework.
; - EEPROM Bypass Mode: Simulates EEPROM storage in RAM for debugging and development purposes.
; - Debugging Options: Allows custom Rprog resistance to be set for testing charging characteristics.
; - High-speed serial communication (1M baud) with enhanced debugging output (timestamps, colorized text).
; - Compatibility with standard Arduino boards like Uno, Nano, and Pro variations.
; - Integration with `simavr` for simulation and testing in PlatformIO.
;
; **Usage Notes:**
; - Ensure the UIRBcore library is installed from: https://github.com/DjordjeMandic/UIRBcorelib.
; - Confirm the UIRB V0.2 board definition is installed for compatibility with the custom board.
; - The EEPROM bypass mode (`UIRB_EEPROM_BYPASS_DEBUG`) enables testing without EEPROM.
; - Use `UIRB_EEPROM_RPROG_DEBUG` to specify a custom Rprog resistance for debugging battery charging.
; - The `simavr` simulator is configured for debugging ATmega328P-based environments.
;
; **Supported Environments:**
; - [env:uirb-v02-simavr]: Default environment for the UIRB V0.2 board using `simavr` for simulation.
; - [env:uno-simavr]: Arduino Uno environment with shared pin configuration for simulation.
; - [env:nano-simavr]: Arduino Nano environment with shared pin configuration for simulation.
; - [env:pro-16mhz-328-simavr]: Arduino Pro 16MHz with shared pin configuration for simulation.
; - [env:pro-8mhz-328p-simavr]: Arduino Pro 8MHz with shared pin configuration for simulation.
;
; **Documentation References:**
; - PlatformIO: https://docs.platformio.org/
; - UIRBcore Library: https://github.com/DjordjeMandic/UIRBcorelib
; - `UIRB_EEPROM_BYPASS_DEBUG` and `UIRB_EEPROM_RPROG_DEBUG`: See UIRBcore library documentation.
; - UIRB V0.2 Board: https://github.com/DjordjeMandic/UIRBpio
;

; General PlatformIO settings
[platformio]
name = UIRB EEPROM Bypass Example
description = EEPROM bypass example demonstrating the use of the UIRBcore library with in RAM EEPROM emulation.
default_envs = uirb-v02-simavr  ; Default environment to use for builds (specified below)

; Common settings for all environments with ATmega328P
[env]
platform = atmelavr                          ; AVR platform for Atmel microcontrollers
framework = arduino                          ; Arduino framework
build_flags = 
    -DUIRB_EEPROM_BYPASS_DEBUG               ; Enable EEPROM bypass mode (data stored in RAM)
    -DUIRB_EEPROM_RPROG_DEBUG=4990           ; Set Rprog resistance to 4990 ohms for debugging
lib_deps =                                   ; Library dependencies
    djordjemandic/UIRBcorelib @ ^1.1.1       ; UIRBcorelib library with version 1.1.1 or higher
monitor_speed = 1000000                      ; Speed for serial monitor communication in bits per second
monitor_filters = default, time, colorize    ; Serial monitor: default output, timestamps, and colorized text
build_src_flags = 
    -DMONITOR_SPEED=${env.monitor_speed}     ; Define monitor speed as a preprocessor macro
debug_tool = simavr                          ; Use simavr simulator for testing in PlatformIO
debug_svd_path = ./svd/atmega328p.svd        ; Path to the SVD file for ATmega328P (used for debugging)

; Environment for the custom UIRB board version 0.2 with ATmega328P
[env:uirb-v02-simavr]
board = uirb-v02-atmega328p                  ; Board configuration for UIRB V0.2 hardware (ATmega328P).
                                             ; For details, see https://github.com/DjordjeMandic/UIRBpio

; Custom pin configuration section
[custom_pin_config]
build_flags = 
    -DPIN_USB_IO3=4               ; Define USB I/O pin
    -DPIN_BUTTON_WAKEUP=2         ; Define button wakeup pin
    -DPIN_BUTTON_OPTION_1=A1      ; Define first option button pin
    -DPIN_BUTTON_OPTION_2=A2      ; Define second option button pin
    -DPIN_BUTTON_OPTION_3=A3      ; Define third option button pin
    -DPIN_PULLDOWN_RESISTOR=5     ; Define pulldown resistor pin
    -DPIN_TX=1                    ; Define UART TX pin
    -DPIN_RX=0                    ; Define UART RX pin
    -DBUTTON_PIN_ACTIVE_STATE=0   ; Define active state for buttons (0 = LOW)
    -DPIN_STAT_LED=LED_BUILTIN    ; Define status LED pin (shared with SPI SCK)
    -DPIN_IR_LED=3                ; Define IR LED pin for IR transmission
    -DPIN_IR_CAPTURE=8            ; Define input capture pin for IR raw signal
    -DIR_CAPTURE_PIN_PULLUP=0     ; Disable pull-up resistor for IR capture pin
    -DPIN_IR_RECEIVE=12           ; Define demodulating IR receiver pin
    -DIR_RECEIVE_PIN_PULLUP=1     ; Enable pull-up resistor for IR receive pin
    -DPIN_PROG=A0                 ; Define pin for the PROG line (TP4057 charger monitoring and control)

; Arduino Uno environment
[env:uno-simavr]
board = uno                          ; Board definition for Arduino Uno
build_flags = 
    ${custom_pin_config.build_flags} ; Reuse custom pin configuration

; Arduino Nano environment
[env:nano-simavr]
board = nano                         ; Board definition for Arduino Nano
build_flags = 
    ${custom_pin_config.build_flags} ; Reuse custom pin configuration

; Arduino Pro 16MHz environment with ATmega328
[env:pro-16mhz-328-simavr]
board = pro16MHzatmega328            ; Board definition for Arduino Pro 16MHz
build_flags = 
    ${custom_pin_config.build_flags} ; Reuse custom pin configuration

; Arduino Pro 8MHz environment with ATmega328P
[env:pro-8mhz-328p-simavr]
board = pro8MHzatmega328             ; Board definition for Arduino Pro 8MHz
build_flags = 
    ${custom_pin_config.build_flags} ; Reuse custom pin configuration
