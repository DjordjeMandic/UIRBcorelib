; PlatformIO Project Configuration File for UIRB 1.1V EEPROM Bypass Example
;
; **Overview:**
; This configuration file defines build and environment settings for multiple Arduino-compatible boards,
; with specific focus on EEPROM bypass and a custom UIRB V0.2 board. It includes options for pin configurations, 
; library dependencies, and serial communication settings.
;
; **Requirements:**
; - Ensure that the custom UIRB V0.2 board definition is installed and available in PlatformIO.
; - Required library: UIRBcorelib (https://github.com/DjordjeMandic/UIRBcorelib).
;
; **Features:**
; - Targets Atmel AVR microcontrollers using the Arduino framework.
; - Customizable pin configurations for standard Arduino boards.
; - EEPROM Bypass: Uses `UIRB_EEPROM_BYPASS_DEBUG` to emulate EEPROM in RAM.
; - Debugging: Custom Rprog resistance can be set with `UIRB_EEPROM_RPROG_DEBUG`.
; - Reusable pin definitions for uniform hardware configuration across environments.
; - High-speed serial monitor (1000000 baud) for efficient communication.
; - Timestamps added to serial monitor output for improved debugging.
; - Support for standard Arduino boards such as Uno, Nano, and Pro variations.
;
; **Environments:**
; - [env:uirb-v02]: Primary target environment for UIRB V0.2 with a fixed pin configuration.
; - [env:uno], [env:nano], [env:pro-16mhz-328], [env:pro-8mhz-328p]: Examples of how the custom pin configuration
;   can be applied to other Arduino-compatible boards.
;
; **Custom Pin Configuration:**
; - [custom_pin_config] defines key hardware settings for other boards.
; - This configuration is shared across multiple environments for consistency and ease of maintenance.
;
; **Documentation:**
; - PlatformIO: https://docs.platformio.org/page/projectconf.html
; - UIRBcore Library: https://github.com/DjordjeMandic/UIRBcorelib
; - UIRB_EEPROM_BYPASS_DEBUG: Documentation available in the UIRBcore library.
; - UIRB_EEPROM_RPROG_DEBUG: Documentation available in the UIRBcore library.

; General PlatformIO settings
[platformio]
default_envs = uirb-v02  ; Default environment to use for builds (specified below)

; Common settings for all environments
[env]
platform = atmelavr       ; AVR platform for Atmel microcontrollers
framework = arduino       ; Arduino framework
build_flags = 
    -DUIRB_EEPROM_BYPASS_DEBUG               ; Enable EEPROM bypass mode (data stored in RAM)
    -DUIRB_EEPROM_RPROG_DEBUG=4990           ; Set Rprog resistance to 4990 ohms for debugging
lib_deps =                ; Library dependencies
    djordjemandic/UIRBcorelib @ ^1.1.1 ; UIRBcorelib library with version 1.1.1 or higher
monitor_speed = 1000000   ; Speed for serial monitor communication in bits per second
monitor_filters = time    ; Add timestamps to serial monitor output
debug_tool = simavr                           ; Use simavr simulator for testing in PlatformIO

; Environment for the custom UIRB board version 0.2 with ATmega328P
[env:uirb-v02]
board = uirb-v02-atmega328p ; Custom board name for the UIRB hardware (defined in boards folder)

; Custom pin configuration section
[custom_pin_config]
build_flags = 
    -DPIN_USB_IO3=4               ; Define USB I/O pin
    -DPIN_BUTTON_WAKEUP=2         ; Define button wakeup pin
    -DPIN_BUTTON_OPTION_1=A1      ; Define first option button pin
    -DPIN_BUTTON_OPTION_2=A2      ; Define second option button pin
    -DPIN_BUTTON_OPTION_3=A3      ; Define third option button pin
    -DPIN_PULLDOWN_RESISTOR=5     ; Define pulldown resistor pin
    -DPIN_TX=1                    ; Define UART TX pin
    -DPIN_RX=0                    ; Define UART RX pin
    -DBUTTON_PIN_ACTIVE_STATE=0   ; Define active state for buttons (0 = LOW)
    -DPIN_STAT_LED=LED_BUILTIN    ; Define status LED pin (shared with SPI SCK)
    -DPIN_IR_LED=3                ; Define IR LED pin for IR transmission
    -DPIN_IR_CAPTURE=8            ; Define input capture pin for IR raw signal
    -DIR_CAPTURE_PIN_PULLUP=0     ; Disable pull-up resistor for IR capture pin
    -DPIN_IR_RECEIVE=12           ; Define demodulating IR receiver pin
    -DIR_RECEIVE_PIN_PULLUP=1     ; Enable pull-up resistor for IR receive pin
    -DPIN_PROG=A0                 ; Define pin for the PROG line (TP4057 charger monitoring and control)

; Arduino Uno environment
[env:uno]
board = uno                      ; Board definition for Arduino Uno
build_flags = 
    ${custom_pin_config.build_flags} ; Reuse custom pin configuration

; Arduino Nano environment
[env:nano]
board = nano                     ; Board definition for Arduino Nano
build_flags = 
    ${custom_pin_config.build_flags} ; Reuse custom pin configuration

; Arduino Pro 16MHz environment with ATmega328
[env:pro-16mhz-328]
board = pro16MHzatmega328        ; Board definition for Arduino Pro 16MHz
build_flags = 
    ${custom_pin_config.build_flags} ; Reuse custom pin configuration

; Arduino Pro 8MHz environment with ATmega328P
[env:pro-8mhz-328p]
board = pro8MHzatmega328         ; Board definition for Arduino Pro 8MHz
build_flags = 
    ${custom_pin_config.build_flags} ; Reuse custom pin configuration
